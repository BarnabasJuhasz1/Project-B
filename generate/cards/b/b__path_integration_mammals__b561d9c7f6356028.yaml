  \ is never observable here either, exactly as for the animal. (b) \"Home base\"\
  \ -> a latched anchor A = pose_estimate[:2] at the first tick, stored together with\
  \ a home signature S = the 181-beam `ranges` vector taken at that instant (inf clipped\
  \ to range_max = 6.0 m) and the yaw at that instant. The paper's familiar reference\
  \ is a visual landmark panorama; the substitution of a planar-lidar range signature\
  \ for that panorama is MINE, not the paper's - the paper says only that a fix on\
  \ \"a rich landmark panorama induces a total reset, comprising both head direction\
  \ and location.\" (c) \"Reset the path integrator to its zero state\" cannot be\
  \ done literally: we do not write pose_estimate, the platform does. What we CAN\
  \ zero is the anchor's expression in the drifted belief frame. On arriving near\
  \ the anchor we re-fit S to the live scan and add the best-fit offset to A, so the\
  \ next excursion's home vector points at the same PHYSICAL place even though the\
  \ belief frame has moved under it. This re-anchoring construction is MINE; the paper\
  \ asserts only that the return clears the integrator.\nSTATE (persists across ticks):\
  \ A (anchor xy, belief frame), S (home scan), e0 (pose_error_estimate at last re-anchor),\
  \ d (path length since last re-anchor, accumulated as the sum of |pose_estimate[:2]\
  \ delta| per tick, so no control-rate assumption is needed), phase in {OUTBOUND,\
  \ RETURN}, and used_sectors (a set of 6 allocentric 60-degree sectors).\nOUTBOUND.\
  \ Pick one excursion bearing per excursion: the allocentric bearing maximising the\
  \ 15-degree-smoothed free range that lies in a sector at least 60 degrees from every\
  \ sector already in used_sectors; if all six sectors are used, clear the set and\
  \ re-use the least recently used one. Six sectors of 60 degrees tile the circle,\
  \ so successive excursions fan around the anchor instead of re-walking one corridor\
  \ - this is the \"centre the excursions on a reference point\" part made concrete,\
  \ and the 60-degree figure is MINE. Drive that bearing: heading error psi = wrap(target_bearing\
  \ - yaw); wz = clip(1.8 * psi, -1.0, 1.0) rad/s; vx = 0.6 * max(0, cos psi) m/s,\
  \ vy = 0. Scale vx by clip((d_min - 0.35) / 0.45, 0, 1), where d_min is the minimum\
  \ range within +/-50 degrees of the travel direction: 0.35 m is roughly the Go2\
  \ body half-diagonal plus a margin (body ~0.70 x 0.31 m), 0.80 m is where full speed\
  \ resumes. If d_min < 0.35 m, re-aim at the nearest bearing within +/-90 degrees\
  \ of the excursion bearing whose range exceeds 1.2 m.\nTERMINATION OF THE OUTBOUND\
  \ LEG - the quantitative heart, and every number below is MINE; the paper gives\
  \ no excursion budget, only \"frequent returns\". Switch to RETURN when any of:\n\
  \  (i)  d >= 12.0 m = 2 * range_max. One range_max of outbound displacement is\n\
  \       the minimum that exposes a sensor footprint of ground not already\n    \
  \   visible from the anchor; 2x allows for the detours the paper says\n       returns\
  \ and excursions actually take.\n  (ii) pose_error_estimate - e0 >= 0.75 m. Re-anchoring\
  \ needs the live scan to\n       overlap S, which requires arriving within about\
  \ range_max / 2 = 3.0 m\n       of the true anchor. The return leg accrues roughly\
  \ as much fresh error\n       as the outbound leg did, so tripping at 0.75 m of\
  \ growth caps expected\n       arrival error near 1.5 m - half the 3.0 m matching\
  \ basin.\n  (iii) no bearing within +/-90 degrees of the excursion bearing has range\
  \ >\n       1.5 m (dead end).\n\nRETURN. h = A - pose_estimate[:2]; psi = wrap(atan2(h_y,\
  \ h_x) - yaw); same Twist law and same clearance modulation as OUTBOUND, with the\
  \ same +/-90 degree sliding detour rule. The home vector is the attractor; the realised\
  \ path may be convoluted.\nRE-ANCHOR (on |h| <= 1.0 m). Search offsets dxy over\
  \ a +/-2.0 m grid at 0.25 m and dyaw over +/-30 degrees at 5 degrees; score each\
  \ by the mean absolute difference between S and the live scan predicted under that\
