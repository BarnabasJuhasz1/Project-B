  \ or not the match is accepted, set e0 <- pose_error_estimate, d <- 0, mark the\
  \ sector used, and pick the next bearing - resetting the budget unconditionally\
  \ prevents thrashing on a rejected match, at the cost of one excursion run on a\
  \ stale anchor.\nLOST-ANCHOR ESCAPE. If a RETURN leg accumulates more than 1.5x\
  \ the outbound leg's path length plus 10.0 m without reaching |h| <= 1.0 m, declare\
  \ the anchor lost: latch a new A and S here, clear used_sectors, and resume OUTBOUND.\
  \ This is mine and exists only so the leaf cannot deadlock; the paper has no analogue.\n\
  Outputs a Twist every tick; never exceeds the |vx|,|vy| <= 0.8 m/s and |wz| <= 1.0\
  \ rad/s saturation, and touches nothing below the frozen policy.\n"
