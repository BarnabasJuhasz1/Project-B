mechanism: 'When a mammal explores an environment it has no representation of, it
  does not perform one open-ended walk. "When exploring a new environment, rats and
  other rodents center their excursion on a basic reference point, their fictive or
  real ''home base'' (Golani et al., 1993)," computing their position vector relative
  to that point, and "Frequent returns to the home base reset the path integrator
  to its zero state, so that each exploratory trip starts with an error-free path
  integrator." The reason this matters is stated by the same paper twice over: path
  integration is "an incremental recursive process, in which changes in the current
  estimate of the position are added to the position vector of the previous step,"
  so "these errors are necessarily cumulative" (section "Computation of Position Vectors
  and Goal Vectors"), and the only thing that clears them is re-encountering a familiar
  place, whose landmarks "set the origin for PI and clear the PI system from errors."
  The consequence for exploration is that the useful unit of exploration is a bounded
  excursion whose length is limited by how much integration error the navigator can
  afford to accumulate before it must return and re-zero - not a walk that runs until
  something interesting happens. The paper also notes that the return itself need
  not be straight: "the return trip can be fairly direct as well as convoluted" (Fig.
  1B), so the home vector is an attractor, not a commanded straight line.

  '
trigger: 'Active while the goal has not yet been latched (obs.goal is None) and the
