node_name: MaintainApproximateHomeVector
source:
  citation: Mueller, M. & Wehner, R. (1988). "Path integration in desert ants, Cataglyphis
    fortis." PNAS 85(14), 5287-5290.
  span: ''
  verified: unverified
mechanism: 'Cataglyphis fortis continuously accumulates a single home vector from
  its own locomotion — direction plus distance travelled — and steers by that vector
  alone when returning, without landmarks. Mueller and Wehner showed the accumulation
  is not exact trigonometric integration: on forced two-leg outbound paths the ants''
  initial homeward courses deviate from the true home direction systematically and
  reproducibly, as a function of the turn angle between the legs. The animal is running
  a cheap incremental approximation. Why this helps: the state is O(1) — one vector,
  updated per step, no path memory, no map — and on natural foraging paths, where
  turns are many and signed in both directions, the per-turn errors largely cancel,
  so the approximation buys enormous computational savings at negligible cost in the
  regime the animal actually operates in. The error is a property of the algorithm,
  not of noise, so it is predictable and bounded rather than random.'
trigger: 'Applies whenever the robot is displacing itself and a return-to-origin or
  origin-relative estimate may later be needed: during any exploration leg with no
  disclosed goal, during any excursion around an obstacle, and at any point where
  the odometry pose estimate is the only thing linking current position to the start.
  It does NOT apply when an external position fix is available; a fix should reset
  the vector rather than be blended into it.'
derivation: 'Integrate a home vector from the commanded Twist stream itself — the
  only channel to the frozen locomotion policy — rather than from the drifting odometry
  pose. Maintain (r, phi): r the estimated straight-line distance back to the start,
  phi the bearing to start in the robot''s current body frame. Per control tick of
  duration dt, first rotate the vector by the executed yaw, phi <- phi - wz*dt, then
  subtract the executed translation, updating (r, phi) from the planar displacement
  (vx*dt, vy*dt). This is the ant''s incremental scheme: one vector, updated in place,
  never a stored path. Two consequences follow from the paper''s actual finding —
  that the accumulator is approximate and its error is turn-driven. First, carry an
  uncertainty radius sigma that grows with accumulated absolute yaw rather than with
  elapsed time, since turns are what corrupt the estimate: sigma <- sigma + k_turn*|wz|*dt
  + k_lin*|v|*dt. Second, the home vector is a coarse heading source, not a position
  fix: emit it as a bearing bias into the goal-seeking Twist, and once r drops below
  sigma, stop trusting it and hand over to a local systematic search instead of driving
  to a point the accumulator claims is the origin. Every constant here (k_turn, k_lin,
  the r < sigma handover) is mine; the paper supplies the structure — single accumulated
  vector, approximate update, turn-dependent systematic error, handover when the vector
  is spent — not these values.'
